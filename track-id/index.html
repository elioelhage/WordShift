<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08070c">
  <meta name="description" content="Track ID — a fast music recognition challenge from WordShift.">
  <title>Track ID — WordShift</title>
  <link rel="canonical" href="https://wordshift.dev/track-id/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/track-id/track-id.css">
  <script defer src="/track-id/track-id.js"></script>
</head>
<body data-difficulty="impossible">
  <header class="site-head">
    <a class="brand" href="/games/" aria-label="WordShift Arcade">
      <span class="brand-mark">W</span><span>WordShift</span><span class="brand-divider">/</span><strong>Track ID</strong>
    </a>
    <nav class="top-nav" aria-label="Main navigation">
      <a class="nav-active" href="/track-id/">Play</a>
      <a href="/games/">All games <span aria-hidden="true">↗</span></a>
    </nav>
  </header>

  <main class="app-layout">
    <aside class="side-panel left-panel" aria-label="Challenge settings">
      <section class="settings-block">
        <div class="side-heading"><span>DIFFICULTY</span></div>
        <div id="difficulty-options" class="difficulty-options" role="group" aria-label="Difficulty">
          <button type="button" data-difficulty="easy">Easy</button>
          <button type="button" data-difficulty="medium">Medium</button>
          <button type="button" data-difficulty="hard">Hard</button>
          <button type="button" data-difficulty="expert">Expert</button>
          <button type="button" data-difficulty="impossible" class="active" aria-pressed="true">Impossible</button>
        </div>
        <button id="reroll-button" class="reroll-button" type="button"><span aria-hidden="true">⟳</span> Reroll all</button>
      </section>
      <section class="mini-stat" aria-live="polite">
        <span>ROUND</span><strong id="round-number">01</strong>
        <div class="mini-stat-row"><span>Score</span><b id="score">0</b></div>
        <div class="mini-stat-row"><span>Streak</span><b id="streak">0</b></div>
      </section>
    </aside>

    <section class="game-column" aria-label="Track ID game">
      <div class="stage-shell" id="stage-shell">
        <div class="stage-brand-watermark" aria-hidden="true">TRACK ID</div>
        <div class="stage-topline">
          <span class="live-pill"><i></i><span id="round-status">READY</span></span>
          <span id="stage-counter" class="stage-counter">CLIP 01 / 05</span>
        </div>

        <div id="filter-reels" class="filter-reels" aria-label="Music filters">
          <div class="filter-row">
            <span class="filter-label">GENRES</span>
            <div id="genre-options" class="filter-options" role="group" aria-label="Genre"></div>
          </div>
          <div class="filter-row">
            <span class="filter-label">ERAS</span>
            <div id="era-options" class="filter-options" role="group" aria-label="Era"></div>
          </div>
          <div class="filter-row">
            <span class="filter-label">ARTISTS</span>
            <div id="artist-options" class="filter-options" role="group" aria-label="Artist"></div>
          </div>
        </div>

        <div id="center-difficulty-options" class="center-difficulty-options" role="group" aria-label="Difficulty">
          <button type="button" data-difficulty="easy">Easy</button>
          <button type="button" data-difficulty="medium">Medium</button>
          <button type="button" data-difficulty="hard">Hard</button>
          <button type="button" data-difficulty="expert">Expert</button>
          <button type="button" data-difficulty="impossible" class="active" aria-pressed="true">Impossible</button>
        </div>

        <div id="round-area" class="round-area">
          <div id="track-art-shell" class="track-art-shell" hidden>
            <img id="track-art" alt="" src="">
            <span id="track-art-fallback" hidden aria-hidden="true">♫</span>
          </div>
          <p id="reveal-kicker" class="reveal-kicker" hidden>YOU GOT IT!</p>
          <h1 id="reveal-title" class="reveal-title" hidden></h1>
          <p id="reveal-artist" class="reveal-artist" hidden></p>
          <p id="reveal-album" class="reveal-album" hidden></p>
          <p id="result-message" class="result-message" hidden></p>

          <div id="clip-timeline" class="clip-timeline" aria-label="Progressive audio clue">
            <div class="clip-track"><span id="clip-progress"></span></div>
            <div class="clip-labels">
              <span data-stage="0">0.1s</span><span data-stage="1">0.5s</span><span data-stage="2">2s</span><span data-stage="3">8s</span><span data-stage="4">15s</span>
            </div>
          </div>

          <button id="main-play" class="main-play" type="button" aria-label="Play song preview" disabled>
            <span id="main-play-icon" aria-hidden="true">▶</span>
          </button>
          <div class="play-caption"><strong id="play-caption">Preparing track</strong><span id="clip-duration">0.1s</span></div>

          <div id="guess-row" class="guess-row">
            <div class="song-search">
              <span class="search-icon" aria-hidden="true">⌕</span>
              <input id="guess-input" type="text" role="combobox" aria-autocomplete="list" aria-controls="song-suggestions" aria-expanded="false" autocomplete="off" placeholder="Name that track" disabled>
              <div id="song-suggestions" class="song-suggestions" role="listbox" aria-label="Song suggestions" hidden></div>
            </div>
            <button id="skip-button" class="skip-button" type="button" disabled><span aria-hidden="true">Ⅱ</span> Skip</button>
          </div>

          <div id="result-actions" class="result-actions" hidden>
            <button id="challenge-button" class="challenge-button" type="button"><span aria-hidden="true">♧</span> Challenge your friend</button>
            <button id="next-button" class="next-button" type="button">Next <span aria-hidden="true">▶|</span></button>
          </div>
          <div id="feedback" class="feedback" aria-live="polite">Getting the music ready…</div>
        </div>
      </div>
    </section>

    <aside class="side-panel right-panel" aria-label="Playback settings">
      <section class="settings-block">
        <div class="side-heading"><span>PLAYBACK</span></div>
        <button id="playback-start" class="setting-action" type="button" aria-pressed="true"><span aria-hidden="true">▷</span><span id="playback-start-label">From the start</span></button>
      </section>
      <section class="settings-block guess-after-block">
        <div class="side-heading"><span>GUESS AFTER</span></div>
        <div id="start-stage-options" class="guess-after-options" role="group" aria-label="Initial clue duration">
          <button type="button" data-start-stage="0">0.1s</button>
          <button type="button" data-start-stage="1">0.5s</button>
          <button type="button" data-start-stage="2">2s</button>
          <button type="button" data-start-stage="3">8s</button>
          <button type="button" data-start-stage="4">15s</button>
        </div>
      </section>
      <section class="settings-block volume-block">
        <div class="side-heading"><span>VOLUME</span><output id="volume-value" for="volume-slider">70%</output></div>
        <input id="volume-slider" type="range" min="0" max="100" value="70" aria-label="Volume">
      </section>
      <section class="settings-block filters-summary">
        <div class="side-heading"><span>YOUR MIX</span></div>
        <p id="mix-summary">Any genre · Any era · Any artist</p>
        <p id="pool-summary" class="pool-summary">Loading available tracks…</p>
      </section>
    </aside>
  </main>

  <audio id="song-audio" preload="auto"></audio>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
