name: Song Hunt validation

on:
  push:
    branches: ["main"]
    paths:
      - "backend/api.js"
      - "song-hunt/**"
      - "vercel.json"
      - ".github/workflows/song-hunt-validation.yml"
  pull_request:
    paths:
      - "backend/api.js"
      - "song-hunt/**"
      - "vercel.json"
      - ".github/workflows/song-hunt-validation.yml"

jobs:
  syntax-and-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Check JavaScript syntax
        run: |
          node --check backend/api.js
          node --check song-hunt/song-hunt.js
      - name: Validate Vercel route configuration
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8')); console.log('vercel.json is valid')"
      - name: Diagnose Render API availability and CORS
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3; do
            echo "Render health check attempt $attempt"
            status=$(curl --silent --show-error --max-time 45 --dump-header /tmp/song-hunt-headers --output /tmp/song-hunt-body --write-out "%{http_code}" -H "Origin: https://wordshift.dev" -H "Accept: application/json" https://wordshift-api.onrender.com/health || true)
            echo "HTTP_STATUS=$status"
            cat /tmp/song-hunt-headers 2>/dev/null || true
            cat /tmp/song-hunt-body 2>/dev/null || true
            if [ "$status" = "200" ]; then
              if grep -qi "^access-control-allow-origin: \\*" /tmp/song-hunt-headers; then
                echo "HEALTH_OK_AND_CORS_WILDCARD_PRESENT"
                exit 0
              fi
              echo "HEALTH_OK_BUT_CORS_HEADER_MISSING"
              exit 1
            fi
            if [ "$status" = "404" ] && grep -qi "^x-render-routing: no-server" /tmp/song-hunt-headers; then
              echo "::warning::The hard-coded Render API hostname has no service attached. Connect Render and update the backend URL before testing Song Hunt's live catalogue."
              exit 0
            fi
            sleep 8
          done
          echo "::warning::Render API did not return HTTP 200 after retries. Live catalogue connectivity was not verified."
          exit 0
