name: Song Hunt validation

on:
  push:
    branches: ["main"]
    paths:
      - "backend/api.js"
      - "song-hunt/**"
      - "vercel.json"
      - ".github/workflows/song-hunt-validation.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/api.js"
      - "song-hunt/**"
      - "vercel.json"
      - ".github/workflows/song-hunt-validation.yml"

jobs:
  syntax-and-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Check JavaScript syntax
        run: |
          node --check backend/api.js
          node --check song-hunt/song-hunt.js
      - name: Validate Vercel route configuration
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8')); console.log('vercel.json is valid')"
      - name: Check deployed Song Hunt frontend asset
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3 4 5 6; do
            echo "Production Song Hunt asset check $attempt"
            status=$(curl --silent --show-error --max-time 20 --output /tmp/song-hunt-live.js --write-out "%{http_code}" "https://wordshift.dev/song-hunt/song-hunt.js?check=${GITHUB_SHA}" || true)
            echo "FRONTEND_HTTP_STATUS=$status"
            if [ "$status" = "200" ]; then
              grep -E 'const ITUNES_SEARCH' /tmp/song-hunt-live.js || true
              if grep -q "https://itunes.apple.com/search" /tmp/song-hunt-live.js; then
                echo "FRONTEND_ITUNES_SOURCE_OK"
                exit 0
              fi
              echo "FRONTEND_NOT_SERVING_EXPECTED_ITUNES_SOURCE"
            fi
            sleep 10
          done
          echo "::warning::wordshift.dev is not yet serving the updated Song Hunt asset. Check the static deployment and asset cache."
          exit 0

      - name: Smoke test Apple iTunes Search used by Song Hunt
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "https://itunes.apple.com/search?term=Imagine%20Dragons&entity=song&country=ca&limit=5" \
            --output /tmp/song-hunt-itunes.json
          node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/song-hunt-itunes.json','utf8')); if (!Array.isArray(p.results) || !p.results.some(t => t.trackId && t.trackName && t.artistName)) process.exit(1); console.log('ITUNES_SEARCH_OK results='+p.results.length);"

