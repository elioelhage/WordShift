name: Song Hunt validation

on:
  push:
    branches: ["main"]
    paths:
      - "backend/api.js"
      - "song-hunt/**"
      - "vercel.json"
      - ".github/workflows/song-hunt-validation.yml"
  pull_request:
    paths:
      - "backend/api.js"
      - "song-hunt/**"
      - "vercel.json"
      - ".github/workflows/song-hunt-validation.yml"

jobs:
  syntax-and-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Check JavaScript syntax
        run: |
          node --check backend/api.js
          node --check song-hunt/song-hunt.js
      - name: Validate Vercel route configuration
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8')); console.log('vercel.json is valid')"
      - name: Check deployed Song Hunt frontend asset
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3 4 5 6; do
            echo "Production Song Hunt asset check $attempt"
            status=$(curl --silent --show-error --max-time 20 --output /tmp/song-hunt-live.js --write-out "%{http_code}" "https://wordshift.dev/song-hunt/song-hunt.js?check=${GITHUB_SHA}" || true)
            echo "FRONTEND_HTTP_STATUS=$status"
            if [ "$status" = "200" ]; then
              grep -E 'const API_URL' /tmp/song-hunt-live.js || true
              if grep -q "https://wordshift-t506.onrender.com/api/song-hunt/catalog" /tmp/song-hunt-live.js; then
                echo "FRONTEND_API_URL_OK"
                exit 0
              fi
              echo "FRONTEND_STILL_SERVING_OLD_API_URL"
            fi
            sleep 10
          done
          echo "::warning::wordshift.dev is not yet serving Song Hunt with the current Render API URL. Check the live hosting deployment and asset cache."
          exit 0

      - name: Probe and warm the Song Hunt catalogue
        if: github.event_name == 'push'
        timeout-minutes: 4
        shell: bash
        run: |
          set +e
          echo "Requesting the live Song Hunt catalogue after backend health check"
          status=$(curl --silent --show-error --max-time 180 --dump-header /tmp/song-hunt-catalog-headers --output /tmp/song-hunt-catalog-body --write-out "%{http_code}" -H "Origin: https://wordshift.dev" -H "Accept: application/json" https://wordshift-t506.onrender.com/api/song-hunt/catalog || true)
          echo "CATALOG_HTTP_STATUS=$status"
          grep -iE '^(content-type|access-control-allow-origin|server|x-render-origin-server):' /tmp/song-hunt-catalog-headers 2>/dev/null || true
          if [ "$status" = "200" ]; then
            node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/song-hunt-catalog-body','utf8')); if (!Array.isArray(p.tracks) || !p.tracks.length) process.exit(2); console.log('CATALOG_OK totalTracks='+(p.counts?.totalTracks ?? p.tracks.length)+' imagineDragons='+(p.counts?.byArtist?.['Imagine Dragons'] ?? '?')+' kanyeWest='+(p.counts?.byArtist?.['Kanye West'] ?? '?')+' cached='+Boolean(p.cached));" || echo "::warning::Catalogue endpoint returned HTTP 200 but the response did not contain a non-empty tracks array."
          else
            echo "::warning::Song Hunt catalogue probe failed. Response body (if any):"
            head -c 2000 /tmp/song-hunt-catalog-body 2>/dev/null || true
            echo
          fi

      - name: Diagnose Render API availability and CORS
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3; do
            echo "Render health check attempt $attempt"
            status=$(curl --silent --show-error --max-time 45 --dump-header /tmp/song-hunt-headers --output /tmp/song-hunt-body --write-out "%{http_code}" -H "Origin: https://wordshift.dev" -H "Accept: application/json" https://wordshift-t506.onrender.com/health || true)
            echo "HTTP_STATUS=$status"
            cat /tmp/song-hunt-headers 2>/dev/null || true
            cat /tmp/song-hunt-body 2>/dev/null || true
            if [ "$status" = "200" ]; then
              if grep -qi "^access-control-allow-origin: \\*" /tmp/song-hunt-headers; then
                echo "HEALTH_OK_AND_CORS_WILDCARD_PRESENT"
                exit 0
              fi
              echo "HEALTH_OK_BUT_CORS_HEADER_MISSING"
              exit 1
            fi
            if [ "$status" = "404" ] && grep -qi "^x-render-routing: no-server" /tmp/song-hunt-headers; then
              echo "::warning::The hard-coded Render API hostname has no service attached. Connect Render and update the backend URL before testing Song Hunt's live catalogue."
              exit 0
            fi
            sleep 8
          done
          echo "::warning::Render API did not return HTTP 200 after retries. Live catalogue connectivity was not verified."
          exit 0
