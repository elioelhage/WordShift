name: WordShift site polish

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply site cleanup
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, shutil

          root = Path('.')
          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')

          # Clean navigation URLs.
          text = text.replace('href="race.html"', 'href="/race"')
          text = text.replace('href="leaderboard.html"', 'href="/leaderboard"')
          text = text.replace('href="index.html"', 'href="/"')
          text = text.replace("window.location.href = 'race.html'", "window.location.href = '/race'")
          text = text.replace('window.location.href = "race.html"', 'window.location.href = "/race"')
          text = text.replace("window.location.href = 'leaderboard.html'", "window.location.href = '/leaderboard'")
          text = text.replace('window.location.href = "leaderboard.html"', 'window.location.href = "/leaderboard"')

          # Use the exact same SVG favicon as the header icon.
          favicon = "<link rel=\"icon\" type=\"image/svg+xml\" href=\"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236aaa64' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='3' width='18' height='18' rx='2'/%3E%3Cpath d='M3 9h18'/%3E%3Cpath d='M9 21V9'/%3E%3C/svg%3E\" />"
          text = re.sub(r'<link rel=["\']icon["\'][^>]*>', favicon, text, count=1)

          # Add a deliberately below-the-fold footer without shrinking the game UI.
          if 'class="site-footer"' not in text:
              footer = '''\n  <footer class="site-footer" aria-label="Copyright">\n    <span>© 2026 Elio El Hage. All rights reserved.</span>\n    <span>WordShift</span>\n  </footer>\n'''
              text = text.replace('  </div>\n\n  <div id="end-modal"', '  </div>' + footer + '\n  <div id="end-modal"', 1)

          # The game board remains locked after reveal, but the rest of the site stays interactive.
          global_key_block = '''\n      document.addEventListener("keydown", (event) => {\n        if (!revealComplete) return;\n        if (event.target === modalClose) return;\n        event.preventDefault();\n        event.stopImmediatePropagation();\n      }, true);\n\n      document.addEventListener("click", (event) => {\n        if (!revealComplete) return;\n        if (event.target.closest("#close-modal")) return;\n        event.preventDefault();\n        event.stopImmediatePropagation();\n      }, true);\n'''
          text = text.replace(global_key_block, '')
          index.write_text(text, encoding='utf-8')

          # Make the main page naturally scrollable so the footer is below the fold.
          css = root / 'style.css'
          css_text = css.read_text(encoding='utf-8')
          css_text = css_text.replace('overflow: hidden;\n  -webkit-text-size-adjust', 'overflow-x: hidden;\n  overflow-y: auto;\n  -webkit-text-size-adjust', 1)
          if '.site-footer {' not in css_text:
              css_text += '''\n\n.site-footer {\n  width: 100%;\n  padding: 1.25rem 1rem 2rem;\n  display: flex;\n  justify-content: center;\n  gap: 0.6rem;\n  flex-wrap: wrap;\n  color: var(--muted);\n  font-size: 0.72rem;\n  letter-spacing: 0.03em;\n  text-align: center;\n}\n'''
          css.write_text(css_text, encoding='utf-8')

          # Create clean extensionless routes while keeping the legacy files working.
          for name in ('race', 'leaderboard'):
              src = root / f'{name}.html'
              dst = root / name / 'index.html'
              dst.parent.mkdir(parents=True, exist_ok=True)
              content = src.read_text(encoding='utf-8')
              content = content.replace('href="index.html"', 'href="/"')
              content = content.replace('href="race.html"', 'href="/race"')
              content = content.replace('href="leaderboard.html"', 'href="/leaderboard"')
              content = re.sub(r'<link rel=["\']icon["\'][^>]*>', favicon, content, count=1)
              # Directory routes need asset URLs rooted at the site.
              content = content.replace('href="style.css"', 'href="/style.css"')
              content = content.replace('href="race.css"', 'href="/race.css"')
              content = content.replace('src="race.js"', 'src="/race.js"')
              dst.write_text(content, encoding='utf-8')

          # Remove stale documentation/filler files from the deployed repository, keeping README.md.
          for path in root.rglob('*.md'):
              if path.name.upper() != 'README.MD':
                  path.unlink()
          PY

      - name: Commit polished site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Polish site navigation, footer, and clean URLs"
          git push

      - name: Remove this one-time workflow
        if: success()
        run: |
          git rm .github/workflows/site-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time site polish workflow"
          git push
